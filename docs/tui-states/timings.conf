# timings.conf — source of truth for the README demo gif (docs/tui-states/live/capture.gif)
# and the hi-res original (docs/tui-states/live/capture.hires.mp4).
# Edit numbers here, then run ./encode.sh. It rebuilds both AND writes
# timings.timeline.txt with the exact [start,end] second of every action.
#
# Format (pipe-separated):  id | kind | a | b | out_s | caption | source
#   kind=window : a=src_start_sec  b=src_end_sec  out_s=seconds in final gif (resamples the raw window)
#                 -> out_s == (b-a) keeps real-time speed; out_s < (b-a) time-lapses (compresses) it
#                 -> source=main reads RAW; source=adjust reads ADJUST_RAW;
#                    source=nav reads NAV_RAW
#   kind=splice : a=PATH_to_png    b=-                       out_s=seconds the still is held
#   kind=fade   : a=PATH_to_png    b=split_y,hold_s,fade_s   out_s=hold_s+fade_s (timeline only)
#                 -> holds the still hold_s, then over fade_s the strip ABOVE split_y (your files)
#                    brightens while the card list BELOW it dims. split_y is in RAW pixels (2x).
#                    Intensity knobs TOP_BRIGHT / BOT_DARK live at the top of encode.sh.
#
# Raw recordings: /tmp/raw.gif, /tmp/adjust-raw.gif, and /tmp/nav-adjust-raw.gif
# for this edit. All complete recordings stay untouched so the slice can be retimed
# without another Gemini run.
# Re-run scene detection after every live capture; Gemini latency changes the generation
# window. The current capture tape records 2250×1688 at 36px so the mono palette survives
# the final GIF downscale.
#
# To shorten: lower an out_s, or delete a line. To slow a beat: raise its out_s.

# caption field (window only): PATH,X,Y,FADEIN,FADEOUT  — X=c centers; FADEIN/FADEOUT in
#   output seconds (blank=default, 0=none). A badge held with FADEOUT=0 carries into the
#   next section if that section re-declares it with FADEIN=0 (seamless hold across cut).
#
