name: Rust

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  rustfmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - run: rustup component add rustfmt
      - run: cargo fmt --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            ca-certificates \
            clang \
            cmake \
            fontconfig \
            fonts-dejavu-core \
            fonts-liberation2 \
            fonts-noto-cjk \
            libclang-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libsqlite3-dev \
            pkg-config
      - run: rustup component add clippy
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2.9.1
        with:
          cache-bin: "false"
          cache-on-failure: "true"
          env-vars: "CARGO CC CFLAGS CXX CMAKE PKG_CONFIG RUST"
          save-if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings

  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            ca-certificates \
            clang \
            cmake \
            fontconfig \
            fonts-dejavu-core \
            fonts-liberation2 \
            fonts-noto-cjk \
            libclang-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libsqlite3-dev \
            pkg-config
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2.9.1
        with:
          cache-bin: "false"
          cache-on-failure: "true"
          env-vars: "CARGO CC CFLAGS CXX CMAKE PKG_CONFIG RUST"
          save-if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
      - run: cargo test --all-targets --all-features --locked

  windows:
    name: windows
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Use the latest stable Rust
        shell: bash
        run: rustup update stable
      - name: Install system dependencies
        shell: pwsh
        run: |
          choco install llvm --yes --no-progress
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2.9.1
        with:
          cache-bin: "false"
          cache-on-failure: "true"
          env-vars: "CARGO CC CFLAGS CXX CMAKE LIBCLANG_PATH PKG_CONFIG RUST"
          save-if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
      - run: cargo check --all-targets --all-features --locked
      - name: Test Windows preferences and paths
        run: cargo test --locked --test config --test config_cli --test paths
