[project]
name = "vocabulary-anki"
version = "0.1.0"
description = "Convert vocabulary JSON to Anki deck"
requires-python = ">=3.9"
dependencies = [
    "genanki>=0.13.0",
    "google-genai>=0.1.0",
    "numpy>=2.0.2",
    "pillow>=10.0.0",
    "pytesseract>=0.3.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]
