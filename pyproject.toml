[project]
name = "kamishibai"
version = "0.1.0"
description = "Generate illustrated Anki decks from vocabulary JSON"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fpdf2>=2.8.0",
    "genanki>=0.13.0",
    "google-genai>=0.1.0",
    "numpy>=2.0.2",
    "pillow>=10.0.0",
    "pytesseract>=0.3.13",
    "rich>=14.3.2",
]

[project.scripts]
kamishibai = "kamishibai.cli:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kamishibai"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.claude",
    "/.uv-cache",
    "/cache",
    "/dist",
    "/output",
    "/test_output",
    "/tmp",
    "/CLAUDE.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]
