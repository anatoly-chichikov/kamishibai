[package]
name = "kamishibai"
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
description = "Generate illustrated Anki decks from schema-driven vocabulary JSON"
publish = false

[dependencies]
anyhow = "=1.0.102"
crossterm = "=0.29.0"
font-kit = "=0.14.3"
image = "=0.25.10"
md5 = "=0.8.0"
ocr-rs = "=2.2.2"
printpdf = { version = "=0.9.1", features = ["images", "jpeg"] }
rand = "=0.10.1"
ratatui = "=0.30.0"
reqwest = { version = "=0.13.2", default-features = false, features = ["blocking", "json", "rustls"] }
rustix = { version = "=1.1.4", features = ["stdio"] }
rusqlite = { version = "=0.39.0", default-features = false }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.11.0"
tempfile = "=3.27.0"
time = "=0.3.47"
zip = "=8.5.1"

[dev-dependencies]
expectrl = "=0.8.0"
insta = "=1.47.2"
lopdf = { version = "=0.39.0", default-features = false }
ron = "=0.12.1"
