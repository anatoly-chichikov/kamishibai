[package]
name = "kamishibai"
version = "1.0.0"
edition = "2024"
rust-version = "1.95.0"
description = "Generate illustrated Anki decks from schema-driven vocabulary JSON"
license = "Apache-2.0"
homepage = "https://github.com/anatoly-chichikov/kamishibai"
repository = "https://github.com/anatoly-chichikov/kamishibai"
publish = false

[dependencies]
anyhow = "=1.0.102"
clap = { version = "=4.6.1", features = ["derive"] }
console = "=0.16.3"
crossterm = "=0.29.0"
image = "=0.25.10"
md5 = "=0.8.0"
ocr-rs = "=2.2.2"
printpdf = { version = "=0.9.1", default-features = false, features = ["images", "jpeg", "text_layout"] }
rand = "=0.10.1"
ratatui = "=0.30.0"
regex = "=1.12.3"
reqwest = { version = "=0.13.2", default-features = false, features = ["blocking", "json", "rustls"] }
rustix = { version = "=1.1.4", features = ["stdio"] }
rusqlite = { version = "=0.39.0", default-features = false, features = ["bundled"] }
rust-fontconfig = { version = "=2.0.0", default-features = false, features = ["std", "parsing"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.11.0"
tempfile = "=3.27.0"
thiserror = "=2.0.18"
time = "=0.3.47"
zip = "=8.5.1"

[dev-dependencies]
assert_cmd = "=2.2.0"
assert_fs = "=1.1.3"
expectrl = "=0.8.0"
insta = "=1.47.2"
lopdf = { version = "=0.39.0", default-features = false }
predicates = "=3.1.4"
ron = "=0.12.1"
